[[mgr.prepend_keymap]]
on = ["u","a"]
run = "plugin yamb save"
desc = "Add bookmark"

[[mgr.prepend_keymap]]
on = ["u","g"]
run = "plugin yamb jump_by_key"
desc = "Jump bookmark by key"

[[mgr.prepend_keymap]]
on = "b"
run = "plugin yamb jump_by_fzf"
desc = "Jump bookmark by fuzzy search"

[[mgr.prepend_keymap]]
on = ["u","d"]
run = "plugin yamb delete_by_key"
desc = "Delete bookmark by key"

[[mgr.prepend_keymap]]
on = ["u","D"]
run = "plugin yamb delete_by_fzf"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on = ["u","r"]
run = "plugin yamb rename_by_key"
desc = "Rename bookmark by key"

[[mgr.prepend_keymap]]
on  = "C"
run = [ 'shell -- ~/convict/open-source/setup-configs/scripts/combined_files_contents.sh "$@"' ]

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount, unmount, or eject a device"

[[mgr.prepend_keymap]]
on   = ["c", "m"]
run  = "plugin chmod"
desc = "Chmod on the selected files"
